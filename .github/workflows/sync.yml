name: sync
on:
  schedule:
    # Once a day at 03:17 UTC. Each run checks the current upstream latest
    # for each tool and adds it if it's new.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_push_latest_browsers:
        description: "Push latest browser closures even if Cachix pins already match"
        required: false
        default: false
        type: boolean
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync-latest:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect-changes.outputs.changed }}
      synced_sha: ${{ steps.detect-changes.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # Use the workflow token so the subsequent push is authenticated.
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record starting revision
        id: starting-revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test npm release resolution
        run: bash scripts/tests/npm-resolution.sh
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: halfwhey
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Update each tool to the current upstream latest only. If any step
      # fails we stop and let a human investigate.
      - name: Update cli
        run: ./scripts/update-cli.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update mcp
        run: ./scripts/update-mcp.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update node
        run: ./scripts/update-node.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update dotnet
        run: ./scripts/update-dotnet.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update python
        run: ./scripts/update-python.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Camoufox browser
        run: ./scripts/update-camoufox-browsers.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Camoufox Python wrapper
        run: ./scripts/update-camoufox.sh
      - name: Detect changes
        id: detect-changes
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ steps.starting-revision.outputs.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push and pin latest browser closures
        run: ./scripts/push-latest-browsers.sh halfwhey 1 cli dotnet mcp node python
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          FORCE: ${{ inputs.force_push_latest_browsers && '1' || '0' }}
      - name: Push commits
        if: steps.detect-changes.outputs.changed == 'true'
        run: git push origin HEAD:main
  push-arm-browser-cache:
    needs: sync-latest
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.sync-latest.outputs.synced_sha }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: halfwhey
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      # Camoufox is exposed on ARM Linux and Apple Silicon. Its updater generates
      # pins on x86_64-linux and defers build validation to this runner.
      - name: Build and cache Camoufox packages
        shell: bash
        run: |
          nix build --no-link --print-out-paths .#camoufox .#camoufox-playwright-cli |
            while IFS= read -r path; do nix path-info -r "$path"; done |
            cachix push halfwhey
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Push and pin latest browser closures
        run: ./scripts/push-latest-browsers.sh halfwhey 1 cli dotnet mcp node python camoufox
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          FORCE: ${{ inputs.force_push_latest_browsers && '1' || '0' }}
  push-darwin-browser-cache:
    needs: sync-latest
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.sync-latest.outputs.synced_sha }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v15
        with:
          name: halfwhey
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Build and cache Camoufox packages
        shell: bash
        run: |
          nix build --no-link --print-out-paths .#camoufox .#camoufox-playwright-cli |
            while IFS= read -r path; do nix path-info -r "$path"; done |
            cachix push halfwhey
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Smoke test Camoufox on Apple Silicon
        timeout-minutes: 5
        run: nix shell .#camoufox -c python scripts/tests/camoufox-smoke.py
      - name: Push and pin latest browser closures
        run: ./scripts/push-latest-browsers.sh halfwhey 1 cli dotnet mcp node python camoufox
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          FORCE: ${{ inputs.force_push_latest_browsers && '1' || '0' }}
